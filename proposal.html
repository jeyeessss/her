<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I have a question... 🥑</title>
    <style>
        :root {
            --dark-green: #3B5828;
            --avocado-green: #81A034;
            --light-green: #D3E4A3;
            --pit-brown: #7A431D;
            --cream: #FFF9D2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cream);
            color: var(--dark-green);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Clean Background Floating Elements */
        .bg-particle {
            position: absolute;
            bottom: -150px;
            font-size: 3.5rem;
            opacity: 0.35;
            animation: floatUp 12s linear infinite;
            z-index: 1;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.35; }
            90% { opacity: 0.35; }
            100% {
                transform: translateY(-130vh) translateX(90px) rotate(360deg);
                opacity: 0;
            }
        }

        .p1 { left: 3%;   animation-duration: 9s;   animation-delay: 0s; }
        .p2 { left: 7%;   animation-duration: 14s;  animation-delay: 4s; }
        .p3 { left: 12%;  animation-duration: 11s;  animation-delay: 1.5s; }
        .p4 { left: 16%;  animation-duration: 16s;  animation-delay: 7s; }
        .p5 { left: 21%;  animation-duration: 13s;  animation-delay: 3s; }
        .p6 { left: 25%;  animation-duration: 10s;  animation-delay: 8.5s; }
        .p7 { left: 30%;  animation-duration: 15s;  animation-delay: 5s; }
        .p8 { left: 34%;  animation-duration: 12s;  animation-delay: 1s; }
        .p9 { left: 39%;  animation-duration: 17s;  animation-delay: 9.5s; }
        .p10 { left: 43%; animation-duration: 11s;  animation-delay: 3.5s; }
        .p11 { left: 48%; animation-duration: 14s;  animation-delay: 6s; }
        .p12 { left: 52%; animation-duration: 10s;  animation-delay: 2s; }
        .p13 { left: 57%; animation-duration: 16s;  animation-delay: 8s; }
        .p14 { left: 61%; animation-duration: 12s;  animation-delay: 4.5s; }
        .p15 { left: 66%; animation-duration: 15s;  animation-delay: 0.5s; }
        .p16 { left: 70%; animation-duration: 13s;  animation-delay: 7.5s; }
        .p17 { left: 75%; animation-duration: 9s;   animation-delay: 5.5s; }
        .p18 { left: 79%; animation-duration: 17s;  animation-delay: 2s; }
        .p19 { left: 84%; animation-duration: 11s;  animation-delay: 9s; }
        .p20 { left: 88%; animation-duration: 14s;  animation-delay: 3.5s; }
        .p21 { left: 91%; animation-duration: 12s;  animation-delay: 6.5s; }
        .p22 { left: 94%; animation-duration: 15s;  animation-delay: 1s; }
        .p23 { left: 96%; animation-duration: 10s;  animation-delay: 4s; }
        .p24 { left: 98%; animation-duration: 13s;  animation-delay: 8s; }

        /* Optimized Card Layout to add padding spaces on Phone POV */
        .container {
            background: white;
            padding: 2rem 1.5rem;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(129, 160, 52, 0.2);
            max-width: 440px;
            width: 85%; /* Adds clear surrounding borders on phones */
            border: 4px solid var(--light-green);
            position: relative;
            z-index: 10;
            box-sizing: border-box;
        }

        .bounce-emoji {
            font-size: 4rem;
            display: inline-block;
            animation: bounceUpAndDown 1.5s ease-in-out infinite;
        }

        @keyframes bounceUpAndDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-size: 1.8rem;
            color: var(--dark-green);
            margin: 15px 0 10px 0;
        }

        p {
            font-size: 1.05rem;
            color: var(--pit-brown);
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            min-height: 70px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yes-btn {
            background-color: var(--avocado-green);
            color: white;
            box-shadow: 0 5px 15px rgba(129, 160, 52, 0.4);
            padding: 14px 30px;
            line-height: 1.2;
        }

        #yes-btn span {
            display: block;
        }

        .gift-subtext {
            font-size: 0.8rem;
            font-weight: normal;
            opacity: 0.9;
            margin-top: 2px;
        }

        #yes-btn:hover {
            transform: scale(1.1);
            background-color: var(--dark-green);
        }

        #no-btn {
            background-color: #f4f4f4;
            color: #888;
            border: 2px solid #ddd;
        }

        .gift-btn {
            background-color: var(--pit-brown);
            color: white;
            padding: 14px 28px;
            border-radius: 25px;
            font-size: 1.05rem;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(122, 67, 29, 0.3);
        }

        .gift-btn:hover {
            transform: scale(1.05);
            background-color: #5c3214;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="bg-particle p1">🥑</div>
    <div class="bg-particle p2">❤️</div>
    <div class="bg-particle p3">🥑</div>
    <div class="bg-particle p4">💚</div>
    <div class="bg-particle p5">🥑</div>
    <div class="bg-particle p6">💕</div>
    <div class="bg-particle p7">🥑</div>
    <div class="bg-particle p8">❤️</div>
    <div class="bg-particle p9">🥑</div>
    <div class="bg-particle p10">💚</div>
    <div class="bg-particle p11">🥑</div>
    <div class="bg-particle p12">💕</div>
    <div class="bg-particle p13">🥑</div>
    <div class="bg-particle p14">❤️</div>
    <div class="bg-particle p15">🥑</div>
    <div class="bg-particle p16">💚</div>
    <div class="bg-particle p17">🥑</div>
    <div class="bg-particle p18">💕</div>
    <div class="bg-particle p19">🥑</div>
    <div class="bg-particle p20">❤️</div>
    <div class="bg-particle p21">🥑</div>
    <div class="bg-particle p22">💚</div>
    <div class="bg-particle p23">🥑</div>
    <div class="bg-particle p24">💕</div>

    <div class="container" id="main-card">
        <div class="bounce-emoji">🥑❤️🥑</div>
        <h1>Hey beautiful,</h1>
        <p>We make the perfect blend. Will you go on a date with me?</p>
        
        <div class="btn-container">
            <button id="yes-btn" onclick="celebrate()">
                <span>YES</span>
                <span class="gift-subtext">(gift inside!)</span>
            </button>
            <button id="no-btn" onclick="shrinkNo()">No</button>
        </div>
    </div>

    <div class="container hidden" id="success-card">
        <div class="bounce-emoji">🎉🥑🥳</div>
        <h1>Yay! It's a date!</h1>
        <p>You've made my day. Get ready for some fun! 🥰</p>
        <button class="gift-btn" onclick="revealGift()">Take a look at the gift 🎁</button>
    </div>

    <div class="container hidden" id="gift-card">
        <div class="bounce-emoji">🎁✨🥑</div>
        <h1>Stay tuned for more!</h1>
        <p>Good things come to those who wait... see you very soon! 👀❤️</p>
    </div>

    <script>
        let noClicks = 0;
        
        function shrinkNo() {
            noClicks++;
            const noBtn = document.getElementById('no-btn');
            const yesBtn = document.getElementById('yes-btn');
            
            if (noClicks < 5) {
                noBtn.style.transform = `scale(${1 - noClicks * 0.2})`;
                yesBtn.style.transform = `scale(${1 + noClicks * 0.12})`;
            } else {
                noBtn.style.display = 'none';
            }
        }

        function celebrate() {
            document.getElementById('main-card').classList.add('hidden');
            document.getElementById('success-card').classList.remove('hidden');
        }

        function revealGift() {
            document.getElementById('success-card').classList.add('hidden');
            document.getElementById('gift-card').classList.remove('hidden');
        }
    </script>
</body>
</html>
